<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modbus 配置与数据</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/all.min.css">
    <style>
        .modbus-container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            color: var(--text-primary);
            flex: 1;
            overflow-y: auto;
            min-height: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .card {
            background: var(--bg-card);
            border: var(--border-card);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: var(--card-shadow);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        .form-group input, .form-group select {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 4px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-color);
        }
        .btn {
            background: var(--nav-item-active-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background: var(--accent-color);
            color: var(--bg-main);
        }
        .btn-stop {
            border-color: #ef4444;
            color: #ef4444;
        }
        .btn-stop:hover {
            background: #ef4444;
            color: white;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .data-table th, .data-table td {
            border: 1px solid var(--border-color);
            padding: 10px;
            text-align: center;
        }
        .data-table th {
            background: rgba(0,0,0,0.2);
            color: var(--text-secondary);
        }
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ef4444;
            margin-right: 8px;
        }
        .status-indicator.active {
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
        }
        .traffic-drawer {
            position: fixed;
            top: 0;
            right: -420px;
            width: 420px;
            height: 100vh;
            background: var(--bg-card);
            border-left: 1px solid var(--border-color);
            box-shadow: -8px 0 24px rgba(0, 0, 0, 0.25);
            transition: right 0.25s ease;
            z-index: 20;
            display: flex;
            flex-direction: column;
        }
        .traffic-drawer.open {
            right: 0;
        }
        .traffic-drawer-mask {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: none;
            z-index: 19;
        }
        .traffic-drawer-mask.open {
            display: block;
        }
        .traffic-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .traffic-drawer-header h3 {
            margin: 0;
            font-size: 16px;
        }
        .traffic-drawer-actions {
            display: flex;
            gap: 8px;
        }
        .traffic-log-status {
            padding: 12px 16px 0;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .traffic-log-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 16px;
        }
        .traffic-log-item {
            border: 1px solid var(--border-color);
            border-left-width: 4px;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            font-size: 13px;
            line-height: 1.5;
        }
        .traffic-log-item.traffic-send {
            border-left-color: #38bdf8;
        }
        .traffic-log-item.traffic-recv {
            border-left-color: #22c55e;
        }
        .traffic-log-item.traffic-error {
            border-left-color: #ef4444;
        }
        .traffic-log-meta {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="status-bar">
            <div class="system-title">
                <i class="fas fa-plug"></i> Modbus RTU (RS485) 配置与数据读取
            </div>
            <div>
                <a href="/" style="color: var(--accent-color); text-decoration: none;"><i class="fas fa-home"></i> 返回主页</a>
            </div>
        </div>

        <div class="modbus-container">
            <div class="card">
                <h3><i class="fas fa-cog"></i> 串口通信配置</h3>
                <br>
                <div class="form-grid">
                    <div class="form-group">
                        <label>串口号 (Port)</label>
                        <select id="port" name="port">
                            <option value="">正在检测串口...</option>
                        </select>
                        <span style="margin-top:6px; font-size:12px; color: var(--text-secondary);">串口列表会自动刷新，也可手动重扫设备</span>
                    </div>
                    <div class="form-group">
                        <label>波特率 (Baudrate)</label>
                        <select id="baudrate" name="baudrate">
                            <option value="4800">4800</option>
                            <option value="9600" selected>9600</option>
                            <option value="19200">19200</option>
                            <option value="38400">38400</option>
                            <option value="115200">115200</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>从站号 (Slave ID)</label>
                        <input type="number" id="slave_id" name="slave_id" value="1" min="1" max="247">
                    </div>
                    <div class="form-group">
                        <label>设备模板 (Template)</label>
                        <select id="template_id" name="template_id">
                            <option value="DAM-3505N">DAM-3505N (三相电量模块)</option>
                            <option value="custom">自定义寄存器 (待实现)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>轮询间隔 (秒)</label>
                        <input type="number" id="interval" name="interval" value="1.0" min="0.1" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>保存目录 (Save Dir)</label>
                        <input
                            type="text"
                            id="save_dir"
                            name="save_dir"
                            value="data/modbus"
                            placeholder="例如: G:\data\modbus"
                        >
                        <span style="margin-top:6px; font-size:12px; color: var(--text-secondary);">可直接选择目录，或手动输入路径</span>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="btn" type="button" onclick="refreshSerialPorts()"><i class="fas fa-rotate-right"></i> 刷新串口</button>
                    <button class="btn" type="button" onclick="selectSaveDir()"><i class="fas fa-folder-open"></i> 选择目录</button>
                    <button class="btn" onclick="saveConfig()"><i class="fas fa-save"></i> 保存配置</button>
                    <button class="btn" onclick="startModbus()"><i class="fas fa-play"></i> 启动采集</button>
                    <button class="btn btn-stop" onclick="stopModbus()"><i class="fas fa-stop"></i> 停止采集</button>
                    <button class="btn" type="button" onclick="toggleTrafficDrawer(true)"><i class="fas fa-exchange-alt"></i> 收发窗口</button>
                </div>
            </div>

            <div class="card">
                <div class="header" style="border: none; padding: 0; margin: 0;">
                    <h3><i class="fas fa-database"></i> 实时数据监控</h3>
                    <div>
                        <span id="statusIndicator" class="status-indicator"></span>
                        <span id="statusText">Stopped</span>
                    </div>
                </div>
                <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 15px;">启动采集后将自动保存 raw 原始寄存器文件、parsed 解析结果文件，并继续写入 SQLite 解析值。</p>
                <div style="overflow-x: auto;">
                    <table class="data-table" id="dataTable">
                        <thead>
                            <tr>
                                <th>数据项</th>
                                <th>地址</th>
                                <th>测量值</th>
                                <th>单位</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="4" style="color: var(--text-secondary);">等待采集启动...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="trafficDrawer" class="traffic-drawer">
        <div class="traffic-drawer-header">
            <h3><i class="fas fa-exchange-alt"></i> 数据收发窗口</h3>
            <div class="traffic-drawer-actions">
                <button class="btn" type="button" onclick="clearTrafficLogs()">清空</button>
                <button class="btn btn-stop" type="button" onclick="toggleTrafficDrawer(false)">关闭</button>
            </div>
        </div>
        <div id="trafficLogStatus" class="traffic-log-status">暂无收发记录</div>
        <div id="trafficLogList" class="traffic-log-list"></div>
    </div>
    <div id="trafficDrawerMask" class="traffic-drawer-mask" onclick="toggleTrafficDrawer(false)"></div>
    
    <script src="/static/js/modbus.js"></script>
</body>
</html>
